[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "datadis-analyzer"
version = "0.1.0"
description = "Modular CLI tool to analyze Spanish DATADIS energy consumption data for residential communities"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Marcos" }
]
dependencies = [
    "pandas>=2.0.0",
    "rich>=13.0.0",
    "typer>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
da = "src.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
